name: Run CSV Aggregation

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    paths:
      - 'results/**'   # Optional: runs automatically whenever new CSVs are pushed to results/

jobs:
  summarize:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run script
        run: python summarize_results.py

      - name: Upload summary CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-run-summary
          path: summary.csv
